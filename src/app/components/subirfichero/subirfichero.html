<div class="container">
  <h2>Subir imagen a la API</h2>
  <hr />
  <div class="mb-3">
    <label class="form-label">Selecciona una imagen:</label>
    <input
      type="file"
      class="form-control"
      accept="image/*"
      (change)="seleccionarArchivo($event)"
    />
  </div>
  @if (archivo) {
    <h4>Archivo seleccionado :</h4>
    <p>
      {{ archivo.fileName }}
    </p>
    <button class="btn btn-success" (click)="subirArchivo()">Subir Imagen</button>
  }
  <h3 class="mt-3">
    {{ mensaje }}
  </h3>
</div>
